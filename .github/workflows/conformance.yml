name: Conformance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPMENT_NODE_VERSION: 24.15.0
  # `npx skills` resolves its dependencies only from versions published before this reviewed
  # instant; keep it after the pinned skills release
  SKILLS_REGISTRY_SNAPSHOT: '2026-10-15T21:50:00.000Z'
  # retry transient registry resets
  npm_config_fetch_retries: '5'

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.selection.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup development Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check repository path portability
        run: npm run path:check
      - name: Select conformance checks
        id: selection
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node src/ci/changes.ts

  correctness:
    name: Root correctness
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup development Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install semantic sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap socat
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Build isolated runtime helpers
        run: npm run runtime:build
      - name: Run maintained root correctness tests
        env:
          MOLDEA_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run test:unit && npm run test:integration

  portable:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Portable contract / Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.17.0'
          - '24.11.0'
          - '26.8.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup development Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Setup compatibility-test Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Capture compatibility-test Node.js
        run: echo "MOLDEA_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Restore development Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
      - name: Install semantic sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap socat
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Build isolated runtime helpers
        run: npm run runtime:build
      - name: Check portable generated artifacts
        run: npm run portable:check
      - name: Run portable integration tests
        env:
          MOLDEA_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run test:integration -- src/portable
      - name: Check tagged skill release identity
        if: github.ref_type == 'tag'
        env:
          MOLDEA_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:identity:check
      - name: Install and compare the portable artifact
        env:
          SKILLS_TEST_HOME: ${{ runner.temp }}/skills-home
          npm_config_before: ${{ env.SKILLS_REGISTRY_SNAPSHOT }}
        run: |
          mkdir -p "$SKILLS_TEST_HOME"
          HOME="$SKILLS_TEST_HOME" XDG_CONFIG_HOME="$SKILLS_TEST_HOME/.config" npx --yes skills@1.5.22 add ./moldea -g -a codex -y --copy
          test -d "$SKILLS_TEST_HOME/.agents/skills/moldea"
          diff --recursive --brief moldea "$SKILLS_TEST_HOME/.agents/skills/moldea"
      - name: Install and compare the tagged release source
        if: github.ref_type == 'tag'
        env:
          SKILLS_TEST_HOME: ${{ runner.temp }}/tagged-skills-home
          npm_config_before: ${{ env.SKILLS_REGISTRY_SNAPSHOT }}
        run: |
          mkdir -p "$SKILLS_TEST_HOME"
          HOME="$SKILLS_TEST_HOME" XDG_CONFIG_HOME="$SKILLS_TEST_HOME/.config" npx --yes skills@1.5.22 add "https://github.com/moldea-ai/skill/tree/${{ github.ref_name }}/moldea" -g -a codex -y --copy
          test -d "$SKILLS_TEST_HOME/.agents/skills/moldea"
          diff --recursive --brief moldea "$SKILLS_TEST_HOME/.agents/skills/moldea"

  quality:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup development Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build isolated runtime helpers
        run: npm run runtime:build
      - name: Typecheck maintained code
        run: npm run typecheck:root
      - name: Typecheck website on tags
        if: github.ref_type == 'tag'
        run: npm --workspace website run typecheck
      - name: Lint root code
        run: npm run lint
      - name: Check root formatting
        run: npm run format:check

  windows-portability:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Windows 2025 deep-path clone and install
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
      - name: Clone under a realistic deep temporary path
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.workspace }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_config_before: ${{ env.SKILLS_REGISTRY_SNAPSHOT }}
        run: |
          $deepRoot = Join-Path $env:RUNNER_TEMP 'users\windows-developer\appdata\local\temp\skills-portability-clone'
          $clonePath = Join-Path $deepRoot 'skill'
          New-Item -ItemType Directory -Force -Path $deepRoot | Out-Null
          git clone --no-hardlinks --no-checkout $env:SOURCE_REPOSITORY $clonePath
          if ($LASTEXITCODE -ne 0) {
            throw 'The repository objects could not be cloned with default Windows path behavior.'
          }

          git -C $clonePath checkout --detach $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw 'The exact candidate could not be checked out with default Windows path behavior.'
          }

          Push-Location $clonePath
          try {
            npm ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) {
              throw 'Development dependencies could not be installed in the deep clone.'
            }

            npm run path:check
            if ($LASTEXITCODE -ne 0) {
              throw 'Repository path portability failed in the deep clone.'
            }

            npm run runtime:build
            if ($LASTEXITCODE -ne 0) {
              throw 'Isolated runtime helpers could not be built in the deep clone.'
            }

            npm run portable:check
            if ($LASTEXITCODE -ne 0) {
              throw 'Portable generated artifacts are stale in the deep clone.'
            }

            npm exec -- vitest run --config vitest/test-unit.config.ts --testNamePattern='^(?!sandbox |proxy shutdown )'
            if ($LASTEXITCODE -ne 0) {
              throw 'Supported Windows unit tests failed in the deep clone.'
            }

            $env:MOLDEA_TEST_NODE = (Get-Command node).Source
            npm run test:integration -- src/portable
            if ($LASTEXITCODE -ne 0) {
              throw 'Portable integration failed on Windows.'
            }

            $skillsHome = Join-Path $deepRoot 'developer-home'
            $sourceSkill = Join-Path $clonePath 'moldea'
            New-Item -ItemType Directory -Force -Path $skillsHome | Out-Null
            $env:USERPROFILE = $skillsHome
            $env:XDG_CONFIG_HOME = Join-Path $skillsHome '.config'
            npx --yes skills@1.5.22 add $sourceSkill -g -a codex -y --copy
            if ($LASTEXITCODE -ne 0) {
              throw 'The skill could not be installed from the deep clone.'
            }

            $installedSkill = Join-Path $skillsHome '.agents\skills\moldea'
            if (-not (Test-Path -PathType Container $installedSkill)) {
              throw 'The installed skill directory is missing.'
            }

            git diff --no-index --exit-code -- moldea $installedSkill
            if ($LASTEXITCODE -ne 0) {
              throw 'The installed skill differs from the portable source.'
            }
          } finally {
            Pop-Location
          }

  macos-portability:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: macOS portable integration
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.DEVELOPMENT_NODE_VERSION }}
      - name: Install workspace dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build isolated runtime helpers
        run: npm run runtime:build
      - name: Check portable generated artifacts
        run: npm run portable:check
      - name: Run portable integration tests
        run: npm run test:integration -- src/portable

  result:
    name: Conformance result
    if: always()
    needs: [changes, correctness, portable, quality, windows-portability, macos-portability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          CORRECTNESS: ${{ needs.correctness.result }}
          PORTABLE: ${{ needs.portable.result }}
          QUALITY: ${{ needs.quality.result }}
          WINDOWS: ${{ needs.windows-portability.result }}
          MACOS: ${{ needs.macos-portability.result }}
        run: |
          test "$CLASSIFICATION" = success
          if [ "$FULL" = true ]; then
            expected=success
          elif [ "$FULL" = false ]; then
            expected=skipped
          else
            exit 1
          fi
          for result in "$CORRECTNESS" "$PORTABLE" "$QUALITY" "$WINDOWS" "$MACOS"; do
            test "$result" = "$expected" || exit 1
          done
