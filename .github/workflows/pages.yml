name: Deploy Skill Website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/website.yml'
      - '.github/workflows/website-checks.yml'
      - 'assets/**'
      - 'CNAME'
      - 'docs/**'
      - 'evidence/**'
      - 'fixtures/conformance-cases.json'
      - 'moldea/**'
      - 'package-lock.json'
      - 'package.json'
      - 'qualification/**'
      - 'README.md'
      - 'src/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0

jobs:
  evidence-selection:
    name: Resolve production evidence and Pages settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      base_path: ${{ steps.pages.outputs.base_path }}
      site_url: ${{ steps.site.outputs.site_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Check selection
        id: selection
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { semantic, qualification } = JSON.parse(readFileSync('evidence/selection.json', 'utf8'));
          if ((semantic === null) !== (qualification === null)) {
            throw new Error('Production evidence selection must be complete or empty.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `selected=${semantic !== null}\n`);
          NODE

      - name: Read GitHub Pages configuration
        if: steps.selection.outputs.selected == 'true'
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Validate production site configuration
        if: steps.selection.outputs.selected == 'true'
        id: site
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const host = process.env.PAGES_HOST;
          if (!host) throw new Error('GitHub Pages did not provide a production host.');
          const site = new URL(`https://${host}`);
          if (site.host !== host || site.username || site.password || site.pathname !== '/' || site.search || site.hash) {
            throw new Error('GitHub Pages provided an invalid production host.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `site_url=${site.origin}\n`);
          NODE

  verify:
    name: Verify Pages website
    needs: evidence-selection
    if: needs.evidence-selection.outputs.selected == 'true'
    uses: ./.github/workflows/website-checks.yml
    with:
      base_path: ${{ needs.evidence-selection.outputs.base_path }}
      site_url: ${{ needs.evidence-selection.outputs.site_url }}

  build:
    name: Build Pages Artifact
    needs: evidence-selection
    if: needs.evidence-selection.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact caller commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Prepare selected production evidence
        run: npm run evidence:prepare

      - name: Build and validate production website
        env:
          BASE_PATH: ${{ needs.evidence-selection.outputs.base_path }}
          SITE_URL: ${{ needs.evidence-selection.outputs.site_url }}
        run: npm run website:build

      - name: Test static artifact integration
        env:
          BASE_PATH: ${{ needs.evidence-selection.outputs.base_path }}
          SITE_URL: ${{ needs.evidence-selection.outputs.site_url }}
        run: npm --workspace website run test:integration:artifact

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy Website
    needs: [evidence-selection, verify, build]
    if: needs.evidence-selection.outputs.selected == 'true' && needs.verify.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  submit-sitemap:
    name: Submit Sitemap to Google Search Console
    needs: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEARCH_CONSOLE_PROPERTY: sc-domain:moldea.ai
      SITEMAP_URL: https://skill.moldea.ai/sitemap-index.xml
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Search Console
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          service_account: moldea-sitemap-submitter@moldea-prod.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false

      - name: Submit sitemap
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          property_path="$(
            node -p 'encodeURIComponent(process.env.SEARCH_CONSOLE_PROPERTY)'
          )"
          sitemap_path="$(
            node -p 'encodeURIComponent(process.env.SITEMAP_URL)'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PUT \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/webmasters/v3/sites/${property_path}/sitemaps/${sitemap_path}"
