name: Deploy Skill Website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/website.yml'
      - 'assets/**'
      - 'CNAME'
      - 'docs/**'
      - 'evidence/**'
      - 'fixtures/conformance-cases.json'
      - 'moldea/**'
      - 'package-lock.json'
      - 'package.json'
      - 'qualification/**'
      - 'README.md'
      - 'src/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install website browser
        run: npm exec --workspace website -- playwright install --with-deps chromium

      - name: Check documentation sources
        run: npm run docs:check

      - name: Test website units
        run: npm --workspace website run test:unit

      - name: Typecheck website
        run: npm --workspace website run typecheck

      - name: Lint website
        run: npm --workspace website run lint

      - name: Check website formatting
        run: npm --workspace website run format:check

      - name: Test browser behavior with clean and synthetic evidence
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: npm --workspace website run test:e2e

      - name: Prepare selected production evidence
        run: npm run evidence:prepare

      - name: Build and validate production website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: npm run website:build

      - name: Test static artifact integration
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: npm --workspace website run test:integration:artifact

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy Website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  submit-sitemap:
    name: Submit Sitemap to Google Search Console
    needs: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEARCH_CONSOLE_PROPERTY: sc-domain:moldea.ai
      SITEMAP_URL: https://skill.moldea.ai/sitemap-index.xml
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Search Console
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          service_account: moldea-sitemap-submitter@moldea-prod.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false

      - name: Submit sitemap
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          property_path="$(
            node -p 'encodeURIComponent(process.env.SEARCH_CONSOLE_PROPERTY)'
          )"
          sitemap_path="$(
            node -p 'encodeURIComponent(process.env.SITEMAP_URL)'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PUT \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/webmasters/v3/sites/${property_path}/sitemaps/${sitemap_path}"
