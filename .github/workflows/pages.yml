name: Deploy Skill Website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/website.yml'
      - 'assets/**'
      - 'CNAME'
      - 'docs/**'
      - 'fixtures/conformance-cases.json'
      - 'fixtures/semantic-evaluation-result.json'
      - 'moldea/**'
      - 'package-lock.json'
      - 'package.json'
      - 'qualification/**'
      - 'README.md'
      - 'tooling/codex-evaluation-host/**'
      - 'tooling/package-candidate/**'
      - 'tooling/release-identity/**'
      - 'tooling/semantic-evaluation/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install website dependencies
        run: npm --prefix website ci --ignore-scripts

      - name: Install website browser
        run: ./website/node_modules/.bin/playwright install --with-deps chromium

      - name: Check documentation sources
        run: npm run docs:check

      - name: Test website units
        run: npm --prefix website run test:unit

      - name: Typecheck website
        run: npm --prefix website run typecheck

      - name: Lint website
        run: npm --prefix website run lint

      - name: Check website formatting
        run: npm --prefix website run format:check

      - name: Build and validate static website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run website:build

      - name: Test static artifact integration
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm --prefix website run test:integration:artifact

      - name: Test browser behavior
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm --prefix website run test:e2e

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    name: Deploy Website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
