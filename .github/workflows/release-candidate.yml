name: Release Candidate

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Checksummed public-package artifact from this workflow run
        required: true
        type: string
      packages_ref:
        description: Exact source commit recorded in the trusted artifact
        required: true
        type: string
      skill_ref:
        description: Exact skill tooling commit matching the reusable workflow
        required: true
        type: string
      skill_version:
        description: Isolated skill release version
        required: false
        type: string
      registry_snapshot:
        description: ISO 8601 UTC instant before which consumer dependencies resolve (empty resolves live)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      packages_ref:
        description: Exact moldea-ai/packages branch, tag, or commit to verify
        required: true
        type: string
      skill_version:
        description: Isolated skill release version (empty uses checkout version)
        required: false
        type: string
      registry_snapshot:
        description: ISO 8601 UTC instant before which consumer dependencies resolve (empty resolves live)
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0
  # retry transient registry resets in setup and consumer installs
  npm_config_fetch_retries: '5'
  pnpm_config_fetch_retries: '5'

jobs:
  pack:
    name: Pack packages candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_name == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout skill tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: skill

      - name: Checkout packages candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: moldea-ai/packages
          ref: ${{ inputs.packages_ref }}
          path: packages

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/pnpm-lock.yaml

      - name: Install skill packing dependencies
        working-directory: skill
        run: npm ci --ignore-scripts

      - name: Install candidate dependencies
        run: pnpm --dir packages install --frozen-lockfile

      - name: Build and validate packages website
        run: pnpm --dir packages website:build

      - name: Build and pack exact candidate closure
        run: |
          candidate_directory="${{ runner.temp }}/cli-candidate-packages"
          mkdir -p "$candidate_directory"
          git -C packages rev-parse HEAD > "$candidate_directory/packages-commit.txt"
          node skill/src/packages/pack.ts \
            --workspace packages \
            --root @moldea.ai/website-ui \
            --output "$candidate_directory"

      - name: Upload candidate closure
        uses: actions/upload-artifact@v7
        with:
          name: cli-candidate-packages
          path: ${{ runner.temp }}/cli-candidate-packages/*
          if-no-files-found: error

  package-managers:
    name: Candidate / ${{ matrix.manager }} ${{ matrix.version }}
    needs: pack
    if: >-
      ${{ always() && (needs.pack.result == 'success' ||
        (needs.pack.result == 'skipped' && inputs.artifact_name != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: npm
            package: npm
            version: '7.0.0'
          - manager: npm
            package: npm
            version: '8.0.0'
          - manager: npm
            package: npm
            version: '9.0.0'
          - manager: npm
            package: npm
            version: '10.0.0'
          - manager: npm
            package: npm
            version: '11.0.0'
          - manager: npm
            package: npm
            version: '12.0.2'
          - manager: pnpm
            package: pnpm
            version: '8.3.1'
          - manager: pnpm
            package: pnpm
            version: '9.0.0'
          - manager: pnpm
            package: pnpm
            version: '10.0.0'
          - manager: pnpm
            package: pnpm
            version: '11.0.0'
          - manager: pnpm
            package: pnpm
            version: '12.3.1'
          - manager: pnpm
            package: pnpm
            version: '11.21.0'
            existing_vitest_version: '3.2.4'
          - manager: yarn
            package: yarn
            version: '1.22.22'
          - manager: yarn
            package: '@yarnpkg/cli-dist'
            version: '4.14.1'
          - manager: yarn
            package: '@yarnpkg/cli-dist'
            version: '4.18.0'
    steps:
      - name: Checkout skill
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: moldea-ai/skill
          ref: ${{ inputs.skill_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install skill development dependencies
        run: npm ci --ignore-scripts

      - name: Download candidate closure
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name || 'cli-candidate-packages' }}
          path: ${{ runner.temp }}/downloaded-package-artifacts

      - name: Select checksummed trusted CLI closure
        if: ${{ inputs.artifact_name != '' }}
        env:
          PACKAGES_COMMIT: ${{ inputs.packages_ref }}
        run: |
          mkdir -p "${{ runner.temp }}/cli-candidate-packages"
          node src/packages/trusted-candidate.ts \
            "${{ runner.temp }}/downloaded-package-artifacts" \
            "${{ runner.temp }}/cli-candidate-packages" \
            "$PACKAGES_COMMIT"

      # the dispatched pack also carries Website UI, which only skill preparation consumes
      - name: Select dispatched CLI closure
        if: ${{ inputs.artifact_name == '' }}
        run: |
          mkdir -p "${{ runner.temp }}/cli-candidate-packages"
          find "${{ runner.temp }}/downloaded-package-artifacts" -maxdepth 1 -type f -name '*.tgz' \
            ! -name 'moldea.ai-website-ui-*.tgz' \
            -exec cp {} "${{ runner.temp }}/cli-candidate-packages/" \;

      - name: Prepare complete skill candidate with development npm
        env:
          MOLDEA_CANDIDATE_SKILL_VERSION: ${{ inputs.skill_version }}
        run: |
          candidate_arguments=(
            --artifacts "${{ runner.temp }}/downloaded-package-artifacts"
            --output "${{ runner.temp }}/skill-candidate"
          )
          if [ -n "$MOLDEA_CANDIDATE_SKILL_VERSION" ]; then
            candidate_arguments+=(--release-version "$MOLDEA_CANDIDATE_SKILL_VERSION")
          fi
          npm run candidate:prepare -- "${candidate_arguments[@]}"

      - name: Install tested package manager
        run: npm install --global --ignore-scripts "${{ matrix.package }}@${{ matrix.version }}"

      # applies after the tested manager is installed, so only consumer installs are pinned
      - name: Pin registry snapshot
        if: ${{ inputs.registry_snapshot != '' }}
        env:
          REGISTRY_SNAPSHOT: ${{ inputs.registry_snapshot }}
          TESTED_MANAGER: ${{ matrix.manager }}@${{ matrix.version }}
        run: |
          # pnpm and Yarn express the instant as a release age in whole minutes, rounded up
          minutes=$(node -e '
            const snapshot = process.env.REGISTRY_SNAPSHOT;
            const time = Date.parse(snapshot);
            if (Number.isNaN(time) || new Date(time).toISOString() !== snapshot)
              throw new Error("registry_snapshot must be an ISO 8601 UTC instant.");
            console.log(Math.ceil((Date.now() - time) / 60_000));
          ')
          {
            # npm 9.0.0 accepts `before` only as a flag, failing on it from the environment
            if [ "$TESTED_MANAGER" != 'npm@9.0.0' ]; then
              echo "npm_config_before=$REGISTRY_SNAPSHOT"
            fi
            echo "pnpm_config_minimum_release_age=$minutes"
            echo "YARN_NPM_MINIMAL_AGE_GATE=$minutes"
          } >> "$GITHUB_ENV"

      - name: Exercise real candidate conformance
        env:
          MOLDEA_CLI_ARTIFACT_DIRECTORY: ${{ runner.temp }}/cli-candidate-packages
          MOLDEA_REQUIRE_REAL_CLI_ARTIFACTS: '1'
          MOLDEA_TEST_MANAGER: ${{ matrix.manager }}
          MOLDEA_TEST_MANAGER_VERSION: ${{ matrix.version }}
          MOLDEA_TEST_EXISTING_VITEST_VERSION: ${{ matrix.existing_vitest_version || '' }}
          MOLDEA_CANDIDATE_SKILL_ROOT: ${{ runner.temp }}/skill-candidate/moldea
        run: node src/packages/package-manager-conformance.ts
