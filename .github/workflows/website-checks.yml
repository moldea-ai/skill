name: Website Checks

on:
  workflow_call:
    inputs:
      base_path:
        required: true
        type: string
      site_url:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  BASE_PATH: ${{ inputs.base_path }}
  SITE_URL: ${{ inputs.site_url }}

jobs:
  # browser suites run locally before merging, not in CI
  checks:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact caller commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Check documentation sources
        run: npm run docs:check

      - name: Typecheck website
        run: npm --workspace website run typecheck

      - name: Lint website
        run: npm --workspace website run lint

      - name: Check website formatting
        run: npm --workspace website run format:check

      - name: Build and validate static website with synthetic evidence
        run: npm --workspace website run build:fixture
