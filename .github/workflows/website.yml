name: Website

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Website checks
    uses: ./.github/workflows/website-checks.yml
    with:
      base_path: /
      site_url: https://skill.moldea.ai

  verify:
    name: Verify Website
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require website checks to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
        run: test "$CHECKS" = success
