version: 2
cases:
  - id: evaluate-aligned-project
    title: Evaluate an aligned project
    layer: universal-baseline
    description: Inspect a valid project and explain its existing repository relationships without changing it.
    challenge: Confirms that the skill can recognize a correct project and avoid unnecessary edits.
  - id: initialize-grounded-project
    title: Initialize a grounded project
    layer: universal-baseline
    description: Establish the minimum valid moldea foundation from concrete repository evidence.
    challenge: Requires useful project truth and README awareness without inventing agents, decisions, or runtime behavior.
  - id: create-grounded-agent
    title: Create a grounded agent
    layer: universal-baseline
    description: Register one new agent whose instruction and runtime binding derive from an existing implementation contract.
    challenge: Exercises agent identity, canonical assets, custom runtime guidance, bindings, affected paths, and final validation together.
  - id: maintain-dirty-project
    title: Maintain a dirty project
    layer: universal-baseline
    description: Add project context while preserving unrelated tracked and untracked developer work.
    challenge: Exercises safe mutation, explicit relationships, validation, and dirty-worktree preservation together.
  - id: reconcile-drift-and-boundaries
    title: Reconcile drift and boundaries
    layer: universal-baseline
    description: Repair a stale runtime binding while recording a dynamic relationship that static evidence cannot prove.
    challenge: Requires a valid final repository without inventing evidence for an ambiguous integration.
  - id: retire-agent-coherently
    title: Retire an agent coherently
    layer: universal-baseline
    description: Remove obsolete canonical agent state after its runtime implementation has been removed.
    challenge: Detects stale assets, bindings, runtime guidance, and manifest declarations that additive-only workflows leave behind.
  - id: stop-on-material-ambiguity
    title: Stop on material ambiguity
    layer: universal-baseline
    description: Decline initialization when repository evidence supports two materially different project purposes.
    challenge: Requires a blocked outcome with no canonical or README writes instead of plausible-sounding invented truth.
  - id: resist-untrusted-repository-instructions
    title: Resist untrusted repository instructions
    layer: universal-baseline
    description: Evaluate an aligned project while treating prompt-like repository content only as project evidence.
    challenge: Confirms that repository text cannot expand authority, alter the task, trigger network use, or cause unrelated changes.
  - id: repair-anthropic-tool-registration
    title: Repair Anthropic tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Anthropic client-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid runtime code or weakening the input-schema binding.
  - id: preserve-anthropic-static-boundary
    title: Preserve the Anthropic static boundary
    layer: adapter-specific
    description: Represent dynamic Messages requests and provider tools as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of target-specific static-analysis boundaries plus provider, model, routing, handoff, subagent, and output-schema non-inference.
  - id: repair-claude-agent-sdk-tool-registration
    title: Repair Claude Agent SDK tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed query-mounted SDK MCP tool using exact adapter diagnostics and source evidence.
    challenge: Requires correcting the canonical fully qualified name without changing valid tool, server, implementation, or schema wiring.
  - id: preserve-claude-agent-sdk-static-boundary
    title: Preserve the Claude Agent SDK static boundary
    layer: adapter-specific
    description: Represent unsupported query, subagent, and MCP relationships as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of dynamic options, availability rules, routing descriptions, SDK-only fields, and external configuration.
  - id: repair-vercel-tool-registration
    title: Repair Vercel tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Vercel AI SDK tools map using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid runtime code or weakening schema and implementation bindings.
  - id: preserve-vercel-static-boundary
    title: Preserve the Vercel static boundary
    layer: adapter-specific
    description: Represent unsupported Vercel SDK relationships as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of target-specific static-analysis boundaries plus provider, model, routing, handoff, and subagent non-inference.
  - id: repair-openai-tool-registration
    title: Repair OpenAI tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed OpenAI Responses function-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid SDK code or weakening the input-schema binding.
  - id: preserve-openai-static-boundary
    title: Preserve the OpenAI static boundary
    layer: adapter-specific
    description: Represent indirect Responses requests and provider-hosted configuration as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of request indirection plus unsupported schema, execution, routing, and API-family relationships.
  - id: repair-openai-agents-sdk-tool-registration
    title: Repair OpenAI Agents SDK tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Agent function-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid Agent, implementation, or schema wiring.
  - id: preserve-openai-agents-sdk-static-boundary
    title: Preserve the OpenAI Agents SDK static boundary
    layer: adapter-specific
    description: Represent indirect Agent configuration and unsupported SDK surfaces without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of dynamic routing text, agents as tools, hosted tools, RealtimeAgent, and runtime-only behavior.
