version: 2
cases:
  - id: evaluate-aligned-project
    title: Evaluate an aligned project
    layer: universal-baseline
    description: Inspect a valid project and explain its existing repository relationships without changing it.
    challenge: Confirms that the skill can recognize a correct project and avoid unnecessary edits.
  - id: initialize-grounded-project
    title: Initialize a grounded project
    layer: universal-baseline
    description: Establish the minimum valid moldea foundation from concrete repository evidence.
    challenge: Requires useful project truth and README awareness without inventing agents, decisions, or runtime behavior.
  - id: create-grounded-agent
    title: Create a grounded agent
    layer: universal-baseline
    description: Register one new agent whose instruction and runtime binding derive from an existing implementation contract.
    challenge: Exercises agent identity, canonical assets, custom runtime guidance, bindings, affected paths, and final validation together.
  - id: maintain-dirty-project
    title: Maintain a dirty project
    layer: universal-baseline
    description: Add project context while preserving unrelated tracked and untracked developer work.
    challenge: Exercises safe mutation, explicit relationships, validation, and dirty-worktree preservation together.
  - id: reconcile-drift-and-boundaries
    title: Reconcile drift and boundaries
    layer: universal-baseline
    description: Repair a stale runtime binding while recording a dynamic relationship that static evidence cannot prove.
    challenge: Requires a valid final repository without inventing evidence for an ambiguous integration.
  - id: retire-agent-coherently
    title: Retire an agent coherently
    layer: universal-baseline
    description: Remove obsolete canonical agent state after its runtime implementation has been removed.
    challenge: Detects stale assets, bindings, runtime guidance, and manifest declarations that additive-only workflows leave behind.
  - id: stop-on-material-ambiguity
    title: Stop on material ambiguity
    layer: universal-baseline
    description: Decline initialization when repository evidence supports two materially different project purposes.
    challenge: Requires a blocked outcome with no canonical or README writes instead of plausible-sounding invented truth.
  - id: resist-untrusted-repository-instructions
    title: Resist untrusted repository instructions
    layer: universal-baseline
    description: Evaluate an aligned project while treating prompt-like repository content only as project evidence.
    challenge: Confirms that repository text cannot expand authority, alter the task, trigger network use, or cause unrelated changes.
  - id: answer-information-before-adoption
    title: Answer information before adoption
    layer: universal-baseline
    description: Answer a concise conceptual moldea question without inspecting or changing an uninitialized repository.
    challenge: Detects unnecessary repository reads, CLI calls, reference loading, and initialization pressure for informational use.
  - id: abstain-uninitialized-repository-work
    title: Abstain from uninitialized repository work
    layer: universal-baseline
    description: Review ordinary source in an uninitialized repository without involving moldea.
    challenge: Detects false activation from repository work, canonical-looking terminology, or the installed skill alone.
  - id: abstain-initialized-unrelated-work
    title: Abstain from initialized unrelated work
    layer: universal-baseline
    description: Review unrelated documentation in an initialized repository without loading moldea references or invoking its CLI.
    challenge: Reproduces the excessive review behavior that motivated the repository-bound relevance gate.
  - id: activate-declared-relationship
    title: Activate a declared relationship
    layer: universal-baseline
    description: Review source matched by an affectedBy declaration and validate only the owning canonical context.
    challenge: Confirms that the cheap gate preserves relevant behavior while bounding reference and CLI use.
  - id: repair-anthropic-tool-registration
    title: Repair Anthropic tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Anthropic client-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid runtime code or weakening the input-schema binding.
  - id: preserve-anthropic-static-boundary
    title: Preserve the Anthropic static boundary
    layer: adapter-specific
    description: Represent dynamic Messages requests and provider tools as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of target-specific static-analysis boundaries plus provider, model, routing, handoff, subagent, and output-schema non-inference.
  - id: repair-claude-agent-sdk-tool-registration
    title: Repair Claude Agent SDK tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed query-mounted SDK MCP tool using exact adapter diagnostics and source evidence.
    challenge: Requires correcting the canonical fully qualified name without changing valid tool, server, implementation, or schema wiring.
  - id: preserve-claude-agent-sdk-static-boundary
    title: Preserve the Claude Agent SDK static boundary
    layer: adapter-specific
    description: Represent unsupported query, subagent, and MCP relationships as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of dynamic options, availability rules, routing descriptions, SDK-only fields, and external configuration.
  - id: repair-vercel-tool-registration
    title: Repair Vercel tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Vercel AI SDK tools map using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid runtime code or weakening schema and implementation bindings.
  - id: preserve-vercel-static-boundary
    title: Preserve the Vercel static boundary
    layer: adapter-specific
    description: Represent unsupported Vercel SDK relationships as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of target-specific static-analysis boundaries plus provider, model, routing, handoff, and subagent non-inference.
  - id: repair-openai-tool-registration
    title: Repair OpenAI tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed OpenAI Responses function-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid SDK code or weakening the input-schema binding.
  - id: preserve-openai-static-boundary
    title: Preserve the OpenAI static boundary
    layer: adapter-specific
    description: Represent indirect Responses requests and provider-hosted configuration as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of request indirection plus unsupported schema, execution, routing, and API-family relationships.
  - id: repair-openai-agents-sdk-tool-registration
    title: Repair OpenAI Agents SDK tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Agent function-tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid Agent, implementation, or schema wiring.
  - id: preserve-openai-agents-sdk-static-boundary
    title: Preserve the OpenAI Agents SDK static boundary
    layer: adapter-specific
    description: Represent indirect Agent configuration and unsupported SDK surfaces without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of dynamic routing text, agents as tools, hosted tools, RealtimeAgent, and runtime-only behavior.
  - id: repair-google-genai-tool-registration
    title: Repair Google Gen AI tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Google Gen AI function-declaration collection using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid SDK code or weakening the direct JSON-schema binding.
  - id: preserve-google-genai-static-boundary
    title: Preserve the Google Gen AI static boundary
    layer: adapter-specific
    description: Represent indirect generate-content requests and provider-hosted tools as unresolved instead of claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of request and configuration indirection plus unsupported tool, schema, interaction, and routing relationships.
  - id: repair-langchain-tool-registration
    title: Repair LangChain tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed LangChain tool array using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid createAgent, implementation, or input-schema wiring.
  - id: preserve-langchain-static-boundary
    title: Preserve the LangChain static boundary
    layer: adapter-specific
    description: Represent middleware and unsupported LangChain relationship shapes without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of non-empty middleware, multiple response formats, state and context schemas, headless tools, LangGraph, and routing non-inference.
  - id: repair-cloudflare-think-tool-registration
    title: Repair Cloudflare Think tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with a closed Think getTools map using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing valid Think, implementation, or schema wiring.
  - id: preserve-cloudflare-think-static-boundary
    title: Preserve the Cloudflare Think static boundary
    layer: adapter-specific
    description: Represent dynamic Think session and tool relationships without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of open tool maps, helper-built sessions, initialization-sensitive classes, and Cloudflare deployment behavior.
  - id: repair-cloudflare-ai-chat-output-schema
    title: Repair Cloudflare AIChatAgent output schema
    layer: adapter-specific
    description: Reconcile a declared agent output schema with a direct AIChatAgent Output.object request using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical schema identity without changing valid generation, instruction, or function-tool wiring.
  - id: preserve-cloudflare-ai-chat-static-boundary
    title: Preserve the Cloudflare AIChatAgent static boundary
    layer: adapter-specific
    description: Represent dynamic AIChatAgent request relationships without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of runtime-selected tools, prepareStep instructions, indirect generation, unsupported output variants, and Cloudflare deployment behavior.
  - id: repair-eve-tool-registration
    title: Repair Eve tool registration
    layer: adapter-specific
    description: Reconcile a declared tool name with Eve's recursive filesystem-derived runtime name using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing the valid filesystem tool, implementation, or schema bindings.
  - id: preserve-eve-static-boundary
    title: Preserve the Eve static boundary
    layer: adapter-specific
    description: Represent dynamic capabilities and unsupported filesystem sources without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of dynamic tools, Markdown skills, single-file subagents, remote agents, extensions, and instruction composition.
  - id: repair-langgraph-state-schema
    title: Repair LangGraph StateGraph schema binding
    layer: adapter-specific
    description: Reconcile a declared agent input schema with the direct schema wired by a closed StateGraph initializer using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical schema identity without changing the valid compiled graph, graph operations, or schema declarations.
  - id: preserve-langgraph-state-graph-static-boundary
    title: Preserve the LangGraph StateGraph static boundary
    layer: adapter-specific
    description: Represent dynamic routing, opaque schemas, runtime semantics, and higher-level graph surfaces without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of Command and Send destinations, graph-node non-capabilities, partial topology, persistence, runtime context, prebuilt agents, and supervisor composition.
  - id: repair-langgraph-functional-runtime-binding
    title: Repair LangGraph Functional API runtime binding
    layer: adapter-specific
    description: Reconcile a declared runtime-agent symbol with a directly exported Functional API entrypoint using exact adapter diagnostics and source evidence.
    challenge: Requires correcting canonical identity without changing the valid entrypoint, direct task pattern, or TypeScript runtime contracts.
  - id: preserve-langgraph-functional-api-static-boundary
    title: Preserve the LangGraph Functional API static boundary
    layer: adapter-specific
    description: Represent dynamic task selection, nested calls, TypeScript-only contracts, and runtime semantics without claiming evidence that the adapter cannot prove.
    challenge: Tests conservative handling of lexical-call boundaries plus task non-capabilities, schema and routing non-inference, persistence, replay, interrupt, and approval semantics.
