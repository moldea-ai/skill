version: 2
id: evaluate-aligned-project
title: Evaluate an aligned project
purpose: Verify that the skill recognizes complete query, subagent, routing, output, and SDK MCP tool evidence without unnecessary edits.
taskFile: task.md
seedDirectory: seed
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        runtime-pattern,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        runtime-pattern,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: unchanged
  mustPreservePaths:
    - moldea/moldea.yaml
    - moldea/agents/support/instruction.md
    - moldea/agents/billing/handoff-description.md
    - moldea/agents/billing/instruction.md
    - moldea/agents/orders/handoff-description.md
    - moldea/agents/orders/instruction.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/tools.ts
  mustChangePaths: []
  mustExistPaths:
    - moldea/moldea.yaml
    - moldea/agents/support/description.md
    - moldea/agents/support/instruction.md
    - moldea/agents/billing/description.md
    - moldea/agents/billing/handoff-description.md
    - moldea/agents/billing/instruction.md
    - moldea/agents/orders/description.md
    - moldea/agents/orders/handoff-description.md
    - moldea/agents/orders/instruction.md
    - moldea/agents/summary/description.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/contracts.ts
    - src/instructions.ts
    - src/tools.ts
  mustNotExistPaths:
    - moldea/runtimes
  allowedChangePaths: []
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-direct-patterns
    description: The actor accurately explains the direct query wrappers plus custom and preset-appended canonical prompt loaders using emitted evidence.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: explains-closed-bindings
    description: The actor accurately explains closed programmatic subagents, Agent availability, effective routing descriptions, explicit and inherited subagent tools, JSON-schema output, and query-mounted SDK MCP tool relationships.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: respects-static-boundary
    description: The actor does not infer agent input-schema, tool output-schema, provider, model, external MCP, runtime execution, or actual invocation relationships.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: validates-without-churn
    description: Every independent validation check accepts the project without changing it during inspection.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
