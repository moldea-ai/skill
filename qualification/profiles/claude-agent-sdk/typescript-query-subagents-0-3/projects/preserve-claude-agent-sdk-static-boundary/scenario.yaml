judgeRequirements:
  - id: explains-direct-evidence
    description: The actor grounds the support agent's direct query pattern and custom system-prompt loader in deterministic adapter evidence while explaining that the normalization-requiring SDK MCP key establishes no canonical runtime-name segment.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: preserves-dynamic-query-boundary
    description: The actor treats factory-built options, main-thread agent selection, prompt arrays, aliases, presets, dynamic definitions, descriptions, and restrictions as unresolved instead of inventing instruction, delegation, routing, or tool relationships.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: preserves-sdk-feature-boundary
    description: The actor keeps observer fields, critical reminders, server instructions, external and per-agent MCP configuration, settings, skills, hooks, and filesystem agents outside canonical relationship inference while retaining the focused unresolved guidance.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: validates-without-churn
    description: Every deterministic layer reports the expected unsupported-key boundary and the workspace remains unchanged.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
