version: 2
id: repair-claude-agent-sdk-tool-registration
title: Repair Claude Agent SDK tool registration
purpose: Verify precise diagnostic-driven repair of a query-mounted SDK MCP tool identity.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: invalid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: [CLAUDE_AGENT_SDK_TOOL_NAME_MISMATCH]
    forbiddenDiagnosticCodes: [CLAUDE_AGENT_SDK_TOOL_REGISTRATION_NOT_WIRED]
    requiredEvidenceKinds: [instruction-loader, language, runtime-package, runtime-pattern, schema]
    forbiddenEvidenceKinds: [tool-registration]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes:
      [CLAUDE_AGENT_SDK_TOOL_NAME_MISMATCH, CLAUDE_AGENT_SDK_TOOL_REGISTRATION_NOT_WIRED]
    requiredEvidenceKinds:
      [instruction-loader, language, runtime-package, runtime-pattern, schema, tool-registration]
    forbiddenEvidenceKinds: [agent-definition]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [
      src/agent.ts,
      src/contracts.ts,
      src/implementations.ts,
      src/tools.ts,
      moldea/agents/support/instruction.md,
    ]
  mustChangePaths: [moldea/moldea.yaml]
  mustExistPaths:
    [moldea/moldea.yaml, src/agent.ts, src/contracts.ts, src/implementations.ts, src/tools.ts]
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths: [moldea/moldea.yaml]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-name-mismatch
    description: The actor explains from validation evidence and repository source that the declared tool name differs from the fully qualified query-mounted SDK MCP tool name. Repeating the internal diagnostic code is not required.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after, workspace-patch]
  - id: repairs-canonical-name
    description: The manifest tool name becomes mcp__support__lookup_order, matching the query mount and source tool without changing valid runtime code.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: preserves-binding-closure
    description: Runtime-agent, instruction-loader, SDK MCP tool registration, implementation, and input-schema bindings remain exact and evidenced.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: validates-project
    description: The mismatch disappears, tool-registration evidence appears, and every deterministic layer passes without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
