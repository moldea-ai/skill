version: 1
agents:
  support:
    runtime:
      id: cloudflare-agents
    bindings:
      runtimeAgent:
        path: /src/support-agent.ts
        symbol: SupportAgent
      instructionLoader:
        path: /src/support-agent.ts
        symbol: loadSupportInstruction
    affectedBy:
      - /src/support-agent.ts
