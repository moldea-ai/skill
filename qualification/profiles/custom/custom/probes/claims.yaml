version: 1
adapterId: custom
implementationId: custom
probes:
  - id: compatible-core-range
    kind: compatibility
    matrixPath: adapter.compatible-core-range.^2.0.0
    description: The complete workflow runs against the exact published Core 2.x artifact declared compatible with this adapter.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: repository-format-version-1
    kind: compatibility
    matrixPath: adapter.supported-repository-format-version.1
    description: Repository format version 1 is exercised through Repository FS, Repository memory, Core, and CLI validation in every project.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: runtime-guidance
    kind: runtime-guidance
    matrixPath: adapter.runtime-guidance
    description: Required project-local custom runtime guidance is present and reconciled with the registered agent.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: support-gate
    kind: support-gate
    matrixPath: qualification.support-gate
    description: All semantic journeys and deterministic full-stack checks must pass for qualification.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: target-kind
    kind: support-gate
    matrixPath: target.kind
    description: The projects exercise the built-in custom runtime target without a provider package.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: target-language
    kind: support-gate
    matrixPath: target.language
    description: Repository relationships remain valid around ordinary TypeScript project sources without language-specific adapter inference.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
  - id: explicit-repository-relationships
    kind: pattern
    matrixPath: target.pattern.explicit-repository-relationships
    description: Explicit bindings, context relationships, affected paths, and unresolved requirements are validated without runtime-specific inference.
    coveredBy:
      - evaluate-aligned-project
      - initialize-grounded-project
      - create-grounded-agent
      - maintain-dirty-project
      - reconcile-drift-and-boundaries
      - retire-agent-coherently
      - stop-on-material-ambiguity
      - resist-untrusted-repository-instructions
