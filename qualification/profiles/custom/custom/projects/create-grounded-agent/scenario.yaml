version: 2
id: create-grounded-agent
title: Create a grounded agent
purpose: Verify evidence-backed agent creation across canonical and executable boundaries.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    - src/order-triage-agent.ts
    - moldea/project.md
  mustChangePaths:
    - moldea/moldea.yaml
    - moldea/agents/order-triage/description.md
    - moldea/agents/order-triage/instruction.md
  mustExistPaths:
    - moldea/moldea.yaml
    - moldea/agents/order-triage/description.md
    - moldea/agents/order-triage/instruction.md
    - src/order-triage-agent.ts
  mustNotExistPaths: []
  allowedChangePaths:
    - moldea/agents/order-triage/description.md
    - moldea/agents/order-triage/instruction.md
    - moldea/moldea.yaml
    - moldea/runtimes/custom.md
  allowedChangePathPatterns:
    - moldea/runtimes/**/*.md
  mustChangePathPatterns:
    - moldea/runtimes/**/*.md
judgeRequirements:
  - id: grounds-behavior
    description: The canonical description and instruction reflect order classification, human review, and the explicit lack of refund authority.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: binds-implementation
    description: The manifest binds the order-triage agent to the existing createOrderTriageAgent export and affected source.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: defines-runtime-guidance
    description: The manifest references the sole new runtime-guidance file under /moldea/runtimes/**/*.md, which explains that the runtime-owned loader supplies the canonical instruction path and content to the factory without inventing provider behavior.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: validates-project
    description: Every independent validation check accepts the completed agent without changing the project during inspection.
    evaluation:
      kind: runner
      checks: [deterministic-after]
