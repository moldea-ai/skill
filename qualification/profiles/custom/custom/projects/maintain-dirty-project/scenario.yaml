version: 1
id: maintain-dirty-project
title: Maintain a dirty project
purpose: Verify a focused context change while preserving unrelated tracked and untracked work.
taskFile: task.md
seedDirectory: seed
overlayDirectory: overlay
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
