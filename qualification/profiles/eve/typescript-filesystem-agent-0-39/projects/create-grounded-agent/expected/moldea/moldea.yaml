version: 1
agents:
  order-triage:
    runtime:
      id: eve
    bindings:
      runtimeAgent:
        path: /agent/agent.ts
        symbol: default
      instructionLoader:
        path: /agent/loaders.ts
        symbol: loadOrderTriageInstruction
      outputSchema:
        path: /agent/contracts.ts
        symbol: OrderTriageOutputSchema
    tools:
      classify-order:
        name: classify_order
        description: Classifies one order for human review.
        implementation:
          path: /agent/implementations.ts
          symbol: classifyOrder
        registration:
          path: /agent/tools/classify_order.ts
          symbol: default
        inputSchema:
          path: /agent/contracts.ts
          symbol: ClassifyOrderInputSchema
        outputSchema:
          path: /agent/contracts.ts
          symbol: ClassifyOrderOutputSchema
    skills:
      review-policy:
        name: review_policy
        description: Applies the human-review boundary to order classification.
        implementation:
          path: /agent/skills/review_policy.ts
          symbol: default
        registration:
          path: /agent/skills/review_policy.ts
          symbol: default
    affectedBy:
      - /agent/**
