version: 2
id: create-grounded-agent
title: Create a grounded agent
purpose: Verify evidence-backed canonical creation across supported Eve filesystem relationships.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds:
      [agent-definition, handoff-registration, skill-registration, tool-registration]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        instruction-loader,
        language,
        runtime-package,
        schema,
        skill-registration,
        tool-registration,
      ]
    forbiddenEvidenceKinds: [handoff-registration]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [
      agent/agent.ts,
      agent/instructions.ts,
      agent/tools/classify_order.ts,
      agent/skills/review_policy.ts,
      moldea/project.md,
    ]
  mustChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  mustExistPaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
      agent/agent.ts,
      agent/instructions.ts,
      agent/tools/classify_order.ts,
      agent/skills/review_policy.ts,
    ]
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: grounds-behavior
    description: Canonical assets reflect classification, human review, and the explicit absence of refund authority.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: binds-filesystem-agent
    description: The manifest binds the exact nested root definition, exclusive TypeScript loader, and direct output schema.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: binds-filesystem-capabilities
    description: The classify_order tool and review_policy skill use their exact path-derived names, implementations, registrations, and schemas.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: avoids-redundant-guidance
    description: No runtime guide is added because every requested relationship uses a supported static filesystem form.
    evaluation:
      kind: runner
      checks: [workspace-assertions]
  - id: validates-project
    description: Every deterministic layer accepts the completed project without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
