version: 1
agents:
  support:
    runtime:
      id: eve
    bindings:
      runtimeAgent:
        path: /agent/agent.ts
        symbol: default
      instructionLoader:
        path: /agent/loaders.ts
        symbol: loadSupportInstruction
      outputSchema:
        path: /agent/contracts.ts
        symbol: SupportOutputSchema
    tools:
      find-order:
        name: find_order
        description: Finds one order by identifier.
        implementation:
          path: /agent/implementations.ts
          symbol: findOrder
        registration:
          path: /agent/tools/find_order.ts
          symbol: default
        inputSchema:
          path: /agent/contracts.ts
          symbol: FindOrderInputSchema
        outputSchema:
          path: /agent/contracts.ts
          symbol: FindOrderOutputSchema
    skills:
      analyze:
        name: analyze
        description: Analyzes source material without adding unsupported facts.
        implementation:
          path: /agent/skills/analyze.ts
          symbol: default
        registration:
          path: /agent/skills/analyze.ts
          symbol: default
    affectedBy:
      - /agent/**
  summary:
    runtime:
      id: eve
    bindings:
      runtimeAgent:
        path: /agent/subagents/summary/agent.ts
        symbol: default
      instructionLoader:
        path: /agent/subagents/summary/instructions.md
      outputSchema:
        path: /agent/contracts.ts
        symbol: SummaryOutputSchema
    affectedBy:
      - /agent/subagents/summary/**
      - /agent/contracts.ts
