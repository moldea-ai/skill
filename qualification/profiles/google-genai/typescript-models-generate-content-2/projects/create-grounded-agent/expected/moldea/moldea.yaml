version: 1
agents:
  order-triage:
    runtime:
      id: google-genai
    bindings:
      runtimeAgent:
        path: /src/order-triage-agent.ts
        symbol: orderTriageAgent
      instructionLoader:
        path: /src/order-triage-agent.ts
        symbol: loadOrderTriageInstruction
    tools:
      classify-order:
        name: classify_order
        description: Classifies an order for human review.
        implementation:
          path: /src/implementations.ts
          symbol: classifyOrder
        registration:
          path: /src/tools.ts
          symbol: classifyOrderDeclaration
        inputSchema:
          path: /src/contracts.ts
          symbol: ClassifyOrderInputSchema
    affectedBy:
      - /src/**
