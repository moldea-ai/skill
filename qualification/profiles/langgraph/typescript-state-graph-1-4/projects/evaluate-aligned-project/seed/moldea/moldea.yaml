version: 1
agents:
  support:
    runtime:
      id: langgraph
    bindings:
      runtimeAgent:
        path: /src/graphs.ts
        symbol: supportGraph
      inputSchema:
        path: /src/contracts.ts
        symbol: SupportInputSchema
      outputSchema:
        path: /src/contracts.ts
        symbol: SupportOutputSchema
    affectedBy:
      - /src/**
  summary:
    runtime:
      id: langgraph
    bindings:
      runtimeAgent:
        path: /src/graphs.ts
        symbol: summaryGraph
      inputSchema:
        path: /src/contracts.ts
        symbol: SummaryInputSchema
      outputSchema:
        path: /src/contracts.ts
        symbol: SummaryOutputSchema
    affectedBy:
      - /src/**
