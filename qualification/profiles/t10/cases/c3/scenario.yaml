version: 2
id: create-grounded-agent
title: Create a grounded agent
purpose: Verify evidence-backed canonical creation across every supported StateGraph relationship.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: [agent-definition, runtime-pattern, schema]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: [agent-definition, language, runtime-package, runtime-pattern, schema]
    forbiddenEvidenceKinds: [instruction-loader, tool-registration]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths: [src/order-triage-graph.ts, moldea/project.md]
  mustChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  mustExistPaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
      src/order-triage-graph.ts,
    ]
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: grounds-behavior
    description: Canonical assets reflect order classification, required human review, and the explicit absence of refund authority.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: binds-direct-graph
    description: The manifest binds the existing directly exported compiled StateGraph definition plus its explicit input- and output-schema symbols.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: preserves-node-boundary
    description: The classify-order node remains a runtime pattern and is not declared as a manifest tool, skill, subagent, handoff, or routing target.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: avoids-redundant-guidance
    description: No runtime guide is added because the integration uses one closed supported graph and no repository-specific dynamic behavior.
    evaluation:
      kind: runner
      checks: [workspace-assertions]
  - id: validates-project
    description: Every deterministic layer accepts the completed project without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
