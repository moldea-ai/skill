version: 2
id: reconcile-drift-and-boundaries
title: Reconcile drift and boundaries
purpose: Verify stale graph-reference repair alongside conservative treatment of dynamic routing.
taskFile: task.md
seedDirectory: seed
overlayDirectory: overlay
expectedDirectory: expected
removePaths: [src/support-graph.ts]
expectedRemovePaths: []
inspection:
  before: invalid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: [agent-definition, runtime-pattern, schema]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: [agent-definition, language, runtime-package, runtime-pattern, schema]
    forbiddenEvidenceKinds: [instruction-loader, tool-registration]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [src/support-workflow.ts, src/dynamic-routing.ts, moldea/agents/support/instruction.md]
  mustChangePaths: [moldea/moldea.yaml]
  mustExistPaths: [src/support-workflow.ts, src/dynamic-routing.ts, moldea/moldea.yaml]
  mustNotExistPaths: [src/support-graph.ts, moldea/runtimes]
  allowedChangePaths: [moldea/moldea.yaml]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: repairs-direct-bindings
    description: Removed graph references are replaced with the existing supportWorkflow, SupportInputSchema, and SupportOutputSchema symbols.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: records-dynamic-boundary
    description: Runtime-selected Command routing is an unresolved warning with a concrete resolution and related source, not invented static destinations, handoffs, or subagents.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: preserves-source
    description: Existing implementation files and canonical agent assets remain unchanged, and removed source is not recreated.
    evaluation:
      kind: runner
      checks: [workspace-assertions]
  - id: validates-project
    description: The initially invalid project becomes valid through every deterministic layer without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
