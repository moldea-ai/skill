version: 2
id: evaluate-aligned-project
title: Evaluate an aligned project
purpose: Verify that the skill recognizes complete direct Agent, tool, schema, and handoff evidence and avoids unnecessary edits.
taskFile: task.md
seedDirectory: seed
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: unchanged
  mustPreservePaths:
    - moldea/moldea.yaml
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/tools.ts
  mustChangePaths: []
  mustExistPaths:
    - moldea/moldea.yaml
    - moldea/agents/support/description.md
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/description.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/contracts.ts
    - src/instructions.ts
    - src/tools.ts
  mustNotExistPaths:
    - moldea/runtimes
  allowedChangePaths: []
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-direct-patterns
    description: The actor accurately explains how each canonical instruction loader reaches its corresponding direct Agent definition using emitted evidence. Equivalent evidence-based wording passes without requiring property-name repetition.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: explains-closed-bindings
    description: The actor accurately explains the declared Agent output schema, closed function-tool registration, direct implementation and schema bindings, and both direct and configured handoffs. Exact symbol repetition is not required when the relationships are unambiguous and deterministic evidence confirms them.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: respects-static-boundary
    description: The actor preserves the repository-established tool implementation while not claiming that OpenAI Agents SDK adapter evidence proves runtime execution, output schemas, routing, handoffs, subagents, agent definitions, or agent input schemas.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: validates-without-churn
    description: Every independent validation check accepts the project without changing it during inspection.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
