version: 2
id: evaluate-aligned-project
title: Evaluate an aligned project
purpose: Verify that the skill recognizes complete direct AIChatAgent evidence and avoids unnecessary edits.
taskFile: task.md
seedDirectory: seed
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        runtime-pattern,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        runtime-pattern,
        schema,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: unchanged
  mustPreservePaths:
    - moldea/moldea.yaml
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/tools.ts
  mustChangePaths: []
  mustExistPaths:
    - moldea/moldea.yaml
    - moldea/agents/support/description.md
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/description.md
    - moldea/agents/summary/instruction.md
    - src/agents.ts
    - src/contracts.ts
    - src/instructions.ts
    - src/tools.ts
  mustNotExistPaths:
    - moldea/runtimes
  allowedChangePaths: []
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-direct-patterns
    description: The actor accurately explains how each canonical instruction loader and direct streamText request reaches its directly exported AIChatAgent class using emitted evidence.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: explains-closed-bindings
    description: The actor accurately explains the closed function-tool schemas and the agentTool handoff to the summary agent.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: respects-static-boundary
    description: The actor does not infer provider, model, or relationships beyond the proved direct-generation and agentTool evidence.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: validates-without-churn
    description: Every independent validation check accepts the project without changing it during inspection.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
