version: 1
agents:
  support:
    runtime:
      id: cloudflare-agents
    bindings:
      runtimeAgent:
        path: /src/agents.ts
        symbol: SupportAgent
      instructionLoader:
        path: /src/instructions.ts
        symbol: loadSupportInstruction
    tools:
      find-order:
        name: find_order
        description: Finds one order by identifier.
        implementation:
          path: /src/implementations.ts
          symbol: findOrder
        registration:
          path: /src/tools.ts
          symbol: findOrderTool
        inputSchema:
          path: /src/contracts.ts
          symbol: FindOrderInputSchema
        outputSchema:
          path: /src/contracts.ts
          symbol: FindOrderOutputSchema
    affectedBy:
      - /src/**
  summary:
    runtime:
      id: cloudflare-agents
    bindings:
      runtimeAgent:
        path: /src/agents.ts
        symbol: SummaryAgent
      instructionLoader:
        path: /src/instructions.ts
        symbol: loadSummaryInstruction
      outputSchema:
        path: /src/contracts.ts
        symbol: SummaryOutputSchema
    affectedBy:
      - /src/**
