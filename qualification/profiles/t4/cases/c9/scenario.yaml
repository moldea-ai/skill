version: 2
resourceProfile: ordinary
id: repair-cloudflare-think-tool-registration
title: Repair Cloudflare Think tool registration
layer: adapter-specific
description: 'Repair a closed Think getTools map identity while preserving a version-spanning instruction declaration and its warning.'
challenge: 'Requires correcting canonical identity without presenting version-dependent configureContext instructions as verified.'
purpose: Verify precise diagnostic-driven repair while retaining an independent version-boundary warning.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: invalid
  after: valid
deterministicEvidence:
  before:
    errorCount: 1
    warningCount: 1
    requiredDiagnosticCodes:
      [CLOUDFLARE_AGENTS_TOOL_NAME_MISMATCH, CLOUDFLARE_AGENTS_RUNTIME_RELATIONSHIP_UNVERIFIED]
    forbiddenDiagnosticCodes: [CLOUDFLARE_AGENTS_TOOL_REGISTRATION_NOT_WIRED]
    requiredDiagnostics:
      - code: CLOUDFLARE_AGENTS_RUNTIME_RELATIONSHIP_UNVERIFIED
        severity: warning
        agentId: support
        relationship: instruction-loader
        reason: version-dependent-behavior
        details:
          packageName: '@cloudflare/think'
          boundaryVersion: 0.18.0
          declaredRange: '>=0.17.0'
    requiredEvidenceKinds: [agent-definition, language, runtime-package]
    forbiddenEvidenceKinds: [instruction-loader, tool-registration]
    requiredEvidence:
      - kind: runtime-package
        agentId: support
        reference: { path: /src/package.json }
  after:
    errorCount: 0
    warningCount: 1
    requiredDiagnosticCodes: [CLOUDFLARE_AGENTS_RUNTIME_RELATIONSHIP_UNVERIFIED]
    forbiddenDiagnosticCodes:
      [CLOUDFLARE_AGENTS_TOOL_NAME_MISMATCH, CLOUDFLARE_AGENTS_TOOL_REGISTRATION_NOT_WIRED]
    requiredDiagnostics:
      - code: CLOUDFLARE_AGENTS_RUNTIME_RELATIONSHIP_UNVERIFIED
        severity: warning
        agentId: support
        relationship: instruction-loader
        reason: version-dependent-behavior
        details:
          packageName: '@cloudflare/think'
          boundaryVersion: 0.18.0
          declaredRange: '>=0.17.0'
    requiredEvidenceKinds: [agent-definition, language, runtime-package, schema, tool-registration]
    forbiddenEvidenceKinds: [instruction-loader, runtime-pattern]
    requiredEvidence:
      - kind: runtime-package
        agentId: support
        reference: { path: /src/package.json }
      - kind: tool-registration
        agentId: support
        capabilityId: lookup-order
        reference: { path: /src/tools.ts, symbol: lookupOrderTool }
        details: { declaredDeferredLoading: absent }
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [
      src/agent.ts,
      src/package.json,
      src/contracts.ts,
      src/implementations.ts,
      src/tools.ts,
      moldea/agents/support/instruction.md,
    ]
  mustChangePaths: [moldea/moldea.yaml]
  mustExistPaths:
    [
      moldea/moldea.yaml,
      src/agent.ts,
      src/package.json,
      src/contracts.ts,
      src/implementations.ts,
      src/tools.ts,
    ]
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths: [moldea/moldea.yaml]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-name-mismatch
    description: The actor explains from validation evidence and repository source that the declared tool name differs from the closed getTools map key. Repeating the internal diagnostic code is not required.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after, workspace-patch]
  - id: repairs-canonical-name
    description: The manifest tool name becomes lookup_order, matching source without changing the valid runtime implementation.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: preserves-binding-closure
    description: Runtime-agent, tool implementation, registration, input-schema, and output-schema bindings remain exact and evidenced without claiming the version-dependent instruction loader or inventing an agent schema.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: validates-project
    description: The mismatch disappears and tool-registration evidence appears; the independent instruction-loader warning remains after repair without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
