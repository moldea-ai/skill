version: 2
resourceProfile: ordinary
id: abstain-uninitialized-repository-work
title: Abstain from uninitialized repository work
layer: universal-baseline
description: 'Review ordinary source in an uninitialized repository without involving moldea.'
challenge: 'Detects false activation from repository work, canonical-looking terminology, or the installed skill alone.'
purpose: Verify that ordinary host-owned review remains unrelated before repository adoption.
taskFile: task.md
seedDirectory: seed
removePaths: []
expectedRemovePaths: []
inspection:
  before: invalid
  after: invalid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: [MOLDEA_MANIFEST_MISSING, MOLDEA_PROJECT_FILE_MISSING]
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: [MOLDEA_MANIFEST_MISSING, MOLDEA_PROJECT_FILE_MISSING]
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: unchanged
  mustPreservePaths: [README.md, package.json, src/retry-policy.ts]
  mustChangePaths: []
  mustExistPaths: [README.md, package.json, src/retry-policy.ts]
  mustNotExistPaths: [moldea]
  allowedChangePaths: []
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: excludes-moldea
    description: The actor's visible report does not mention moldea or reveal skill reference content, and command evidence contains zero moldea CLI calls.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, actor-command-policy]
  - id: preserves-workspace
    description: The repository remains uninitialized and unchanged.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
