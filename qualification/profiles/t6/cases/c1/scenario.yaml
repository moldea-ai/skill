version: 2
id: evaluate-aligned-project
title: Evaluate an aligned project
purpose: Verify that the skill recognizes complete Eve filesystem evidence and avoids unnecessary edits.
taskFile: task.md
seedDirectory: seed
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        schema,
        skill-registration,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [
        agent-definition,
        handoff-registration,
        instruction-loader,
        language,
        runtime-package,
        schema,
        skill-registration,
        tool-registration,
      ]
    forbiddenEvidenceKinds: []
expectedActorOutcome: completed
workspace:
  expectation: unchanged
  mustPreservePaths:
    - moldea/moldea.yaml
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/handoff-description.md
    - agent/agent.ts
    - agent/instructions.ts
    - agent/tools/find_order.ts
    - agent/skills/analyze.ts
    - agent/subagents/summary/agent.ts
  mustChangePaths: []
  mustExistPaths:
    - moldea/moldea.yaml
    - moldea/agents/support/description.md
    - moldea/agents/support/instruction.md
    - moldea/agents/summary/description.md
    - moldea/agents/summary/handoff-description.md
    - moldea/agents/summary/instruction.md
    - agent/agent.ts
    - agent/contracts.ts
    - agent/instructions.ts
    - agent/tools/find_order.ts
    - agent/skills/analyze.ts
    - agent/subagents/summary/agent.ts
    - agent/subagents/summary/instructions.md
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths: []
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: explains-filesystem-definitions
    description: The actor accurately explains the nested root and directory-backed local-subagent definitions from exact filesystem evidence.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: explains-exclusive-instructions
    description: The actor distinguishes the root TypeScript loader from the summary agent's exact lowercase Markdown instruction source.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: explains-capability-bindings
    description: The actor accurately explains the path-derived find_order tool, TypeScript analyze skill, schemas, implementations, and summary handoff.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: respects-static-boundary
    description: The actor does not infer provider, model, remote-agent, extension, connection, or runtime-only relationships.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: validates-without-churn
    description: Every independent validation check accepts the project without changing it during inspection.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
