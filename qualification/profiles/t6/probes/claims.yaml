version: 2
adapterId: eve
implementationId: typescript-filesystem-agent-0-39
probes:
  - id: compatible-core-range
    kind: compatibility
    matrixPath: adapter.compatible-core-range.^3.0.0
    description: The published adapter and exact Eve runtime composition exercise the compatible Core range.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: repository-format-version
    kind: compatibility
    matrixPath: adapter.supported-repository-format-version.1
    description: Every completed fixture uses and validates Repository Format version 1.
    coveredBy: [evaluate-aligned-project, initialize-grounded-project, create-grounded-agent]
  - id: runtime-guidance
    kind: runtime-guidance
    matrixPath: adapter.runtime-guidance
    description: The boundary case records dynamic and unsupported Eve behavior outside static inspection.
    coveredBy: [evaluate-aligned-project, preserve-eve-static-boundary]
  - id: support-gate
    kind: support-gate
    matrixPath: qualification.support-gate
    description: The profile includes every universal journey and two Eve-specific adversarial cases.
    coveredBy:
      [
        evaluate-aligned-project,
        initialize-grounded-project,
        create-grounded-agent,
        maintain-dirty-project,
        reconcile-drift-and-boundaries,
        retire-agent-coherently,
        stop-on-material-ambiguity,
        resist-untrusted-repository-instructions,
        answer-information-before-adoption,
        abstain-uninitialized-repository-work,
        abstain-initialized-unrelated-work,
        activate-declared-relationship,
        repair-eve-tool-registration,
        preserve-eve-static-boundary,
      ]
  - id: target-kind
    kind: compatibility
    matrixPath: target.kind
    description: Fixtures pin the published npm runtime and inspect project-owned filesystem sources.
    coveredBy: [evaluate-aligned-project]
  - id: target-language
    kind: compatibility
    matrixPath: target.language
    description: Supported Eve modules are strict TypeScript ESM and typecheck with the exact project compiler.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: eve-package
    kind: compatibility
    matrixPath: target.package.npm.eve.primary.>=0.39.1 <0.40.0
    description: Every fixture pins the verified Eve package.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, preserve-eve-static-boundary]
  - id: runtime-agent-binding
    kind: binding-support
    matrixPath: target.binding-support.runtime-agent
    description: Exact root and directory-backed local-subagent definitions remain bound to their filesystem slots.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, reconcile-drift-and-boundaries]
  - id: output-schema-binding
    kind: binding-support
    matrixPath: target.binding-support.output-schema
    description: Direct defineAgent output schemas bind exact repository-local symbols.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, reconcile-drift-and-boundaries]
  - id: instruction-loader-binding
    kind: binding-support
    matrixPath: target.binding-support.instruction-loader
    description: Exclusive Markdown and TypeScript instruction slots bind exact canonical loaders.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, preserve-eve-static-boundary]
  - id: tool-implementation-binding
    kind: binding-support
    matrixPath: target.binding-support.tool-implementation
    description: Direct defineTool execution binds repository-local implementations without invocation.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
  - id: tool-registration-binding
    kind: binding-support
    matrixPath: target.binding-support.tool-registration
    description: Filesystem registration paths remain exact across direct and recursively nested tools.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
  - id: tool-input-schema-binding
    kind: binding-support
    matrixPath: target.binding-support.tool-input-schema
    description: Direct defineTool input schemas bind exact repository-local symbols.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
  - id: tool-output-schema-binding
    kind: binding-support
    matrixPath: target.binding-support.tool-output-schema
    description: Direct defineTool output schemas bind exact repository-local symbols.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
  - id: skill-implementation-binding
    kind: binding-support
    matrixPath: target.binding-support.skill-implementation
    description: TypeScript skill implementation paths bind their discovered filesystem artifacts.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: skill-registration-binding
    kind: binding-support
    matrixPath: target.binding-support.skill-registration
    description: Closed TypeScript defineSkill modules bind their direct default registrations.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: agent-definition-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.agent-definition
    description: Supported root and local-subagent definitions emit normalized agent evidence.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: handoff-registration-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.handoff-registration
    description: A unique directory-backed local subagent with aligned routing text emits handoff evidence.
    coveredBy: [evaluate-aligned-project]
  - id: instruction-loader-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.instruction-loader
    description: Exclusive supported instruction slots emit loader evidence.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, preserve-eve-static-boundary]
  - id: language-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.language
    description: Supported direct definitions emit TypeScript language evidence.
    coveredBy: [evaluate-aligned-project]
  - id: runtime-package-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.runtime-package
