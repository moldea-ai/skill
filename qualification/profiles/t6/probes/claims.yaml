    matrixPath: target.evidence-kind.schema
    description: Agent-output and tool schema bindings emit normalized schema evidence.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
  - id: skill-registration-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.skill-registration
    description: Registration-eligible TypeScript skills emit normalized skill evidence.
    coveredBy: [evaluate-aligned-project, create-grounded-agent]
  - id: tool-registration-evidence
    kind: evidence-kind
    matrixPath: target.evidence-kind.tool-registration
    description: Correct path-derived names emit tool evidence after canonical reconciliation.
    coveredBy: [evaluate-aligned-project, create-grounded-agent, repair-eve-tool-registration]
