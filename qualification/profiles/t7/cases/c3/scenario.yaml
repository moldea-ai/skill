version: 2
id: create-grounded-agent
title: Create a grounded agent
purpose: Verify evidence-backed canonical creation across every supported Google Gen AI binding.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds: []
    forbiddenEvidenceKinds: [runtime-pattern]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [instruction-loader, language, runtime-package, runtime-pattern, schema, tool-registration]
    forbiddenEvidenceKinds: [agent-definition]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [
      src/contracts.ts,
      src/implementations.ts,
      src/order-triage-agent.ts,
      src/tools.ts,
      moldea/project.md,
    ]
  mustChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  mustExistPaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
      src/contracts.ts,
      src/implementations.ts,
      src/order-triage-agent.ts,
      src/tools.ts,
    ]
  mustNotExistPaths: [moldea/runtimes]
  allowedChangePaths:
    [
      moldea/moldea.yaml,
      moldea/agents/order-triage/description.md,
      moldea/agents/order-triage/instruction.md,
    ]
  allowedChangePathPatterns: []
  mustChangePathPatterns: []
judgeRequirements:
  - id: grounds-behavior
    description: Canonical assets reflect classification, human review, and the explicit absence of refund authority.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: binds-direct-wrapper
    description: The manifest binds the existing direct generate-content wrapper and instruction loader without inventing unsupported output-schema or routing relationships.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: binds-function-declaration
    description: The classify_order name, repository-established implementation, function-declaration registration, and input-schema symbols match the existing project contract without claiming adapter evidence proves runtime execution.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after]
  - id: avoids-redundant-guidance
    description: No runtime guide is added because the integration uses supported direct patterns without repository-specific wrapper behavior.
    evaluation:
      kind: runner
      checks: [workspace-assertions]
  - id: validates-project
    description: Every deterministic layer accepts the completed project without read-time mutation.
    evaluation:
      kind: runner
      checks: [deterministic-after]
