version: 1
agents:
  support:
    runtime:
      id: langchain
    bindings:
      runtimeAgent:
        path: /src/support-agent.ts
        symbol: supportAgent
      instructionLoader:
        path: /src/support-agent.ts
        symbol: loadSupportInstruction
      outputSchema:
        path: /src/support-agent.ts
        symbol: SupportOutputSchema
    affectedBy:
      - /src/**
