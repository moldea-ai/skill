version: 1
agents:
  support:
    runtime:
      id: langgraph
    bindings:
      runtimeAgent:
        path: /src/support-workflow.ts
        symbol: supportWorkflow
    affectedBy:
      - /src/**
    unresolved:
      dynamic-task-selection:
        category: routing
        effect: warning
        description: A task is selected from runtime input and does not establish agent routing, handoffs, or subagents.
        resolution: Use separately bound direct entrypoints when canonical agent relationships are required, or retain this explicit boundary.
        related:
          - path: /src/dynamic-routing.ts
