version: 2
id: preserve-vercel-static-boundary
title: Preserve the Vercel static boundary
purpose: Verify relationship-local preparation closure and unsupported ToolLoopAgent boundaries.
taskFile: task.md
seedDirectory: seed
expectedDirectory: expected
removePaths: []
expectedRemovePaths: []
inspection:
  before: valid
  after: valid
deterministicEvidence:
  before:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [agent-definition, instruction-loader, language, runtime-package, schema, tool-registration]
    forbiddenEvidenceKinds: [runtime-pattern]
  after:
    requiredDiagnosticCodes: []
    forbiddenDiagnosticCodes: []
    requiredEvidenceKinds:
      [agent-definition, instruction-loader, language, runtime-package, schema, tool-registration]
    forbiddenEvidenceKinds: [runtime-pattern]
expectedActorOutcome: completed
workspace:
  expectation: changed
  mustPreservePaths:
    [
      src/support-agent.ts,
      src/step-support-agent.ts,
      src/delegating-agent.ts,
      src/contracts.ts,
      src/instructions.ts,
      src/implementations.ts,
      src/status-tools.ts,
      src/delegation.ts,
      src/delegation-tool.ts,
      src/workflow-agent.mts,
      moldea/agents/support/description.md,
      moldea/agents/support/instruction.md,
      moldea/agents/step-support/description.md,
      moldea/agents/step-support/instruction.md,
      moldea/agents/delegating-support/description.md,
      moldea/agents/delegating-support/instruction.md,
    ]
  mustChangePaths: [moldea/moldea.yaml]
  mustExistPaths:
    [
      src/support-agent.ts,
      src/step-support-agent.ts,
      src/delegating-agent.ts,
      src/delegation.ts,
      src/workflow-agent.mts,
      moldea/moldea.yaml,
    ]
  mustNotExistPaths: []
  allowedChangePaths: [moldea/moldea.yaml]
  allowedChangePathPatterns: [moldea/runtimes/**/*.md]
  mustChangePathPatterns: [moldea/runtimes/**/*.md]
judgeRequirements:
  - id: preserves-prepare-call-boundary
    description: For supportAgent, the actor preserves agent-definition and input-schema proof while recording instruction-loader, output-schema, and tool relationships as unresolved because prepareCall can replace them.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: preserves-prepare-step-boundary
    description: For stepSupportAgent, the actor records only the instruction-loader relationship as unresolved and preserves its proved agent-definition, input-schema, output-schema, and get_status tool relationships.
    evaluation:
      kind: judge
      evidenceSources: [actor-output, current-workspace, deterministic-after]
  - id: does-not-infer-subagent-handoff
    description: The actor preserves the delegate_support function tool and its direct bindings without adding routing, handoff, or subagent relationships from its call to stepSupportAgent.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: keeps-workflow-agent-outside-target
    description: The actor preserves workflowSupportAgent as source but does not register it as a ToolLoopAgent target or infer canonical evidence from the unsupported @ai-sdk/workflow API.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: records-focused-guidance
    description: Both prepared agents reference the sole new runtime-guidance file under /moldea/runtimes/**/*.md, which distinguishes prepareCall from prepareStep and gives the appropriate closed-constructor alternatives without claiming provider behavior.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, workspace-patch]
  - id: records-unresolved-boundaries
    description: Separate unresolved warnings name each preparation boundary, its related source, and the relationship-specific closed-constructor resolution.
    evaluation:
      kind: judge
      evidenceSources: [current-workspace, deterministic-after, workspace-patch]
  - id: validates-project
    description: Every deterministic layer accepts the project, relationship-local evidence remains exact, and every source and agent instruction file remains unchanged.
    evaluation:
      kind: runner
      checks: [deterministic-after, workspace-assertions]
